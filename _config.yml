# ============================================================
# Site
# ============================================================
title: Oliver Ferns
name: Oliver Ferns # jekyll-seo-tag
author: Oliver Ferns # jekyll-seo-tag
description: Blog of Oliver Ferns
url: "https://oferns.github.io" # required for absolute canonical/sitemap/feed URLs
baseurl: "" # user page lives at the root — leave empty
locale: en-GB
timezone: Europe/London

# ============================================================
# URLs
# ============================================================
# Pins today's URL shape (/meta/2026-09-17/hello-world.html). Jekyll's bare
# default would be /2026/09/17/hello-world.html.
permalink: /:categories/:year-:month-:day/:title:output_ext

# Home page shows the newest posts, newest first. Jekyll 4 has NO built-in
# pagination (that is the jekyll-paginate gem); a bare blog lists them all.
# Set a number to cap the list, or 0/omit for everything.
home_post_limit: 20

# ============================================================
# Plugins
# ============================================================
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  posts:
    limit: 20

# ============================================================
# Front matter defaults
# ============================================================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# ============================================================
# Markdown / highlighting
# ============================================================
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge

# Used by _layouts/post.html to render "n min read".
reading_time_wpm: 200

# ============================================================
# Never published. Jekyll renders published .md through Liquid, so prose with
# {% %} / {{ }} in these files breaks the build.
# ============================================================
exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - scripts/
  - vendor/
  - .github/
  - .ruby-version
