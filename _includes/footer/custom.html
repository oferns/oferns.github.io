<!-- Light/dark mode toggle -->
<div class="page__footer-skin-toggle">
  <button id="skin-toggle" type="button" aria-label="Toggle light and dark mode" title="Toggle light/dark mode">
    <i class="fa fa-moon" aria-hidden="true"></i>
  </button>
</div>
<script>
  (function () {
    var link = document.getElementById('skin-dark');
    var btn = document.getElementById('skin-toggle');
    if (!link || !btn) return;

    function isDark() { return !link.disabled; }

    function render() {
      btn.innerHTML = isDark() ? '<i class="fa fa-sun" aria-hidden="true"></i>' : '<i class="fa fa-moon" aria-hidden="true"></i>';
    }

    btn.addEventListener('click', function () {
      link.disabled = !link.disabled;
      try { localStorage.setItem('mm-skin', isDark() ? 'dark' : 'light'); } catch (e) {}
      render();
    });

    // Follow OS preference changes until the user makes an explicit choice
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      var stored = null;
      try { stored = localStorage.getItem('mm-skin'); } catch (err) {}
      if (!stored) link.disabled = !e.matches;
    });

    render();
  })();
</script>
