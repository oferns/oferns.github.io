version: 2
updates:
  # Gems: keep Jekyll/theme/plugins current. Grouped so the Jekyll ecosystem
  # arrives as one PR rather than five.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      jekyll-ecosystem:
        patterns:
          - "jekyll"
          - "jekyll-*"
          - "minimal-mistakes-jekyll"
          - "kramdown*"
          - "rouge"

  # Action majors (actions/checkout@v7 etc.) drift the fastest.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
