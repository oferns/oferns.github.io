name: Build and deploy

# Production deploy: build with the repo's own Gemfile (Jekyll 4.4 + the theme
# gem) and publish the artifact to Pages. Pages must be set to
# "GitHub Actions" as its build source — `rake`/CI is the only build path.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write # required by actions/deploy-pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses .ruby-version (3.4.3) and caches the bundle from Gemfile.lock.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Smoke assertions
        run: bash scripts/check.sh _site

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
